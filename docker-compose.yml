services:
  postgres:
    image: postgres:15-alpine
    container_name: http_meme_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: http_meme
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: http_meme_redis
    ports:
      - "6379:6379"


  adminer:
    image: adminer:latest
    container_name: http_meme_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres


  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    container_name: http_meme_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  postgres_data:
